<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detectives de problemas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#FBFCFE; --grid:#DCE6F2; --ink:#1F3A93; --ink-soft:#E7ECFA;
  --text:#23303F; --muted:#5B6878; --line:#C9D3E0;
  --marker:#FFE45C; --ok:#1E7F52; --ok-bg:#E3F4EB; --bad:#B8322A; --bad-bg:#FBE7E5;
  --panel:#FFFFFF; --bg:#EEF2F8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B2433; --grid:#26324A; --ink:#9DB4FF; --ink-soft:#24314F;
    --text:#E6ECF5; --muted:#A3B0C2; --line:#34415A;
    --marker:#8A7414; --ok:#5CD39A; --ok-bg:#16352A; --bad:#FF8A80; --bad-bg:#3D1F1F;
    --panel:#141B27; --bg:#0F1520;
  }
}
:root[data-theme="dark"]{
  --paper:#1B2433; --grid:#26324A; --ink:#9DB4FF; --ink-soft:#24314F;
  --text:#E6ECF5; --muted:#A3B0C2; --line:#34415A;
  --marker:#8A7414; --ok:#5CD39A; --ok-bg:#16352A; --bad:#FF8A80; --bad-bg:#3D1F1F;
  --panel:#141B27; --bg:#0F1520;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:17px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
header.top h1{font-size:1.45rem;margin:0;color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;width:170px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin-bottom:16px}
.intro p{margin:.3em 0;max-width:72ch}
ol.ctxlist{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:8px}
ol.ctxlist li{display:flex;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
ol.ctxlist li:first-child{border-top:0}
.num{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--ink-soft);color:var(--ink);display:grid;place-items:center;font-weight:700}
.ctxinfo{flex:1}
.ctxinfo b{display:block}
.ctxinfo span{color:var(--muted);font-size:.92rem}
.state{font-size:.9rem;color:var(--muted);min-width:110px;text-align:right}
.state.done{color:var(--ok);font-weight:700}
.simbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.simbox select{border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--panel)}
/* Pantalla de problema */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.bar .where{font-weight:700;color:var(--ink)}
.timer{font-weight:700;font-size:1.1rem;padding:4px 12px;border:2px solid var(--ink);border-radius:6px;color:var(--ink)}
.timer.low{border-color:var(--bad);color:var(--bad)}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:1fr}}
.context{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.context h2{margin:0 0 8px;font-size:1.25rem;color:var(--ink)}
.context p{margin:.5em 0;max-width:62ch}
.w{border-radius:3px;padding:0 1px}
.marking .w{cursor:pointer}
.marking .w:hover{background:var(--ink-soft)}
.w.hl{background:var(--marker)}
.markbtn{margin-top:8px;font-size:.9rem}
.tablewrap{overflow-x:auto;margin:10px 0}
table.data{border-collapse:collapse;background:var(--panel);min-width:260px}
table.data th,table.data td{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.data th{background:var(--ink);color:var(--panel)}
.fig{max-width:100%;height:auto;display:block;margin:10px 0}
.question{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.qhead{color:var(--muted);font-size:.92rem;margin-bottom:4px}
.prompt{font-weight:700;margin:0 0 12px;max-width:60ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 12px}
.opt:hover{border-color:var(--ink)}
.opt .dot{width:18px;height:18px;border:2px solid var(--muted);border-radius:50%;flex:0 0 auto}
.opt.sel{border-color:var(--ink);background:var(--ink-soft)}
.opt.sel .dot{border-color:var(--ink);background:var(--ink)}
.opt.okk{border-color:var(--ok);background:var(--ok-bg)}
.opt.nok{border-color:var(--bad);background:var(--bad-bg)}
.numin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numin input,.numin select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel);min-width:140px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fb{margin-top:14px;border-radius:6px;padding:10px 14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);border-left:5px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border-left:5px solid var(--bad)}
.fb.info{background:var(--ink-soft);border-left:5px solid var(--ink)}
.phases{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.phases p.lbl{margin:0 0 6px;color:var(--muted);font-size:.92rem}
.phbtns{display:flex;flex-wrap:wrap;gap:6px}
.phbtns button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 12px;font-size:.92rem}
.phbtns button.seen{background:var(--ink-soft);border-color:var(--ink)}
.hint{margin-top:8px;background:var(--ink-soft);border-radius:6px;padding:8px 12px;display:none}
.hint.show{display:block}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.qnav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel)}
.qnav button.cur{border:2px solid var(--ink);font-weight:700}
.qnav button.ans{background:var(--ink-soft)}
.qnav button.good{background:var(--ok-bg);border-color:var(--ok)}
.qnav button.wrong{background:var(--bad-bg);border-color:var(--bad)}
.results{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.results h2{margin-top:0;color:var(--ink)}
.score{font-size:2rem;font-weight:700;color:var(--ink)}
.rlist{list-style:none;padding:0;margin:12px 0 0}
.rlist li{border-top:1px solid var(--line);padding:10px 0}
.rlist .tag{font-weight:700}
.rlist .tag.ok{color:var(--ok)} .rlist .tag.bad{color:var(--bad)}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);max-width:560px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(15,21,32,.45)}
dialog textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--paper);color:var(--text);font:inherit;font-size:.92rem}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){.fb.show{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}

.tabs{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content;max-width:100%;margin-bottom:16px}
.tabs button{border:0;border-right:1px solid var(--line);background:var(--panel);padding:8px 16px}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
h2.bloque{font-size:1.05rem;color:var(--ink);margin:18px 0 8px}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;width:100%}
.checks label{display:flex;gap:6px;align-items:center}

.aviso{color:var(--bad);font-weight:700}
.nota{max-width:80ch;margin:0 0 12px}
.nivelbar{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.sesrow{flex-wrap:wrap}
.sesbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;padding-left:48px}
.simlbl{color:var(--muted);margin-left:8px}
.btn.small{padding:4px 10px;font-size:.9rem}
.kpis{display:flex;flex-wrap:wrap;gap:24px;margin:8px 0 4px}
.results h3{font-size:1.05rem;color:var(--ink);margin:20px 0 8px}
.pbar{display:grid;grid-template-columns:minmax(150px,240px) 1fr auto;gap:10px;align-items:center;margin:6px 0}
.ptrack{height:14px;background:var(--ink-soft);border-radius:7px;overflow:hidden}
.pfill{display:block;height:100%;background:var(--ink)}
.pfill.hi{background:var(--ok)} .pfill.lo{background:var(--bad)}
.pnum{font-size:.9rem;color:var(--muted);white-space:nowrap}
.tlist{list-style:none;padding:0;margin:0}
.tlist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.muted{color:var(--muted)}
@media (max-width:600px){.pbar{grid-template-columns:1fr}.sesbtns{padding-left:0}}

.cab{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 10px;padding:14px 20px;border-radius:20px;background:linear-gradient(120deg,#E6F0FF 0%,#CFE2FF 55%,#B9D4FF 100%);border:3px solid #1F4E9C}
.cab .tit{min-width:0;flex:1 1 340px}
.cab h1{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(40px,7vw,78px);line-height:1;margin:0;color:#12337A;letter-spacing:-.5px}
.cab h1 span{background:linear-gradient(90deg,#12337A,#2F6FE0);-webkit-background-clip:text;background-clip:text;color:transparent}
.cab .sub{margin:6px 0 0;color:#2B4A85;font-weight:600}
.cab .logo{background:#fff;border-radius:14px;padding:6px 12px;box-shadow:0 2px 0 rgba(18,51,122,.25);flex:0 0 auto}
.cab .logo img{display:block;height:clamp(56px,9vw,96px);width:auto}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cab{background:linear-gradient(120deg,#142447 0%,#1A3365 55%,#21427F 100%);border-color:#6FA0F0}:root:not([data-theme="light"]) .cab h1{color:#CFE0FF}:root:not([data-theme="light"]) .cab h1 span{background:linear-gradient(90deg,#CFE0FF,#7FB0FF);-webkit-background-clip:text;background-clip:text;color:transparent}:root:not([data-theme="light"]) .cab .sub{color:#B9CEF5}}
:root[data-theme="dark"] .cab{background:linear-gradient(120deg,#142447 0%,#1A3365 55%,#21427F 100%);border-color:#6FA0F0}:root[data-theme="dark"] .cab h1{color:#CFE0FF}:root[data-theme="dark"] .cab h1 span{background:linear-gradient(90deg,#CFE0FF,#7FB0FF);-webkit-background-clip:text;background-clip:text;color:transparent}:root[data-theme="dark"] .cab .sub{color:#B9CEF5}
.cab h1{font-size:clamp(34px,5.2vw,60px)}
</style>
</head>

function gcd(a,b){while(b){[a,b]=[b,a%b];}return a;}
function lcm(a,b){return a/gcd(a,b)*b;}
function fr(n,d){const g=gcd(n,d);return (n/g)+"/"+(d/g);}
function fmt(n){return (Math.round(n*1000)/1000).toLocaleString("es-ES",{maximumFractionDigits:3});}
function eur(n){return (Math.round(n*100)/100).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";}
function hora(min){min=((min%1440)+1440)%1440;return Math.floor(min/60)+":"+String(min%60).padStart(2,"0");}
function kg(g){return fmt(g/1000)+" kg";}
const cap=s=>s[0].toUpperCase()+s.slice(1);
function masaTxt(g,L){
  if(g%1000===0) return (g/1000)+" kg";

  const r=Math.random();
  if(L===3 && g>1000 && r<0.5) return Math.floor(g/1000)+" kg y "+((g%1000)/10)+" dag";
  if(r<0.35) return g+" g"; if(r<0.65) return (g/10)+" dag"; return fmt(g/1000)+" kg";
}

  const L2=s=>s.map(txt).join(" < "); const swap=[...asc]; [swap[1],swap[2]]=[swap[2],swap[1]];

   MC(ctx.q,[{t:txt(best)+" "+ctx.u,ok:true},...pool.map(x=>o(txt(x)+" "+ctx.u,why1(x),x===opp?"cond":"dec"))],
     `Ordenados: ${L2(asc)}. ${ctx.max?"El mayor":"El menor"} es ${txt(best)}.`,
     {c:ctx.max?"Buscas el número mayor.":"En una carrera gana quien tarda menos.",p:"Compara primero la parte entera y después cifra a cifra.",e:"Escribe todos con el mismo número de decimales añadiendo ceros.",k:"0,5 = 0,50 = 0,500."}),
   MC("¿Qué lista está ordenada de menor a mayor?",[{t:L2(asc),ok:true},(L2(byLen)!==L2(asc)?o(L2(byLen),"Esta lista ordena por número de cifras. Hay que comparar el valor.","dec"):o(L2([asc[0],asc[1],asc[2],asc[4],asc[3]]),"Los dos últimos están cambiados de sitio. Comprueba cada pareja.","dec")),o(L2(swap),"Hay dos números cambiados de sitio. Comprueba cada pareja.","dec"),o(asc.slice().reverse().map(txt).join(" < "),"Está al revés: va de mayor a menor.","preg")],
     `${L2(asc)}.`,
     {c:"De menor a mayor: el primero es el más pequeño.",p:"Añade ceros para que todos tengan las mismas cifras decimales.",e:"Compara como si fueran números enteros: 3,200 y 3,025.",k:"Comprueba cada pareja de números seguidos."})];
  if(L>=2) qs.push(NUM(`¿Cuál es la diferencia entre el mayor y el menor de los ${ctx.x}?`,ctx.u,(asc[4]-asc[0])/1000,{},`${txt(asc[4])} − ${txt(asc[0])} = ${txt(asc[4]-asc[0])}.`,{c:"Busca el mayor y el menor.",p:"Réstalos.",e:"Alinea las comas al restar.",k:"Suma tu resultado al menor: debe dar el mayor."}));

const KEY="ptp6-v3";
let DB=(()=>{ try{ const v=JSON.parse(localStorage.getItem(KEY)); if(v&&v.perfiles) return v; }catch(e){} return {perfiles:{},ultimo:""}; })();
function guardar(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){} }
const clave=n=>(n||"").trim().toLowerCase().replace(/\s+/g," ")||"(sin nombre)";
function perfil(){ const k=clave(DB.ultimo); return DB.perfiles[k]||(DB.perfiles[k]={nombre:(DB.ultimo||"").trim(),res:{},log:[],sims:[]}); }
function hoy(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const fechaES=s=>{const [y,m,d]=s.split("-");return `${+d}/${+m}/${y}`;};
function registrar(t,r,pistas,errs,src){ perfil().log.push({d:hoy(),t,r,p:pistas,e:errs,s:src}); guardar(); }
const tipoDe=id=>TIPOS.find(t=>t.id===id);

let tab="tipos", nivelTipos=2, sim=null, timerId=null;
const app=document.getElementById("app"), inNombre=document.getElementById("nombre");
inNombre.value=DB.ultimo||"";
inNombre.addEventListener("change",()=>{ DB.ultimo=inNombre.value.trim(); const P=perfil(); if(!P.nombre) P.nombre=DB.ultimo; guardar(); inicio(); });
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function words(t){ return t.split(/(\s+)/).map(w=>/^\s+$/.test(w)?w:`<span class="w">${esc(w)}</span>`).join(""); }
function parseNum(v){ v=String(v).replace(/€|%|\s|kg|m²|m2|min|veces/gi,"").replace(",","."); if(v===""||isNaN(Number(v))) return null; return Number(v); }

// ===== Estadísticas =====
function estadisticas(filtro){
  const log=perfil().log.filter(filtro||(()=>true)); const porTipo={}, porBloque={}, errs={}; let tot={n:0,primera:0,repetir:0,sin:0,p:0};
  for(const x of log){ const T=tipoDe(x.t); if(!T) continue;
    const a=porTipo[x.t]||(porTipo[x.t]={n:0,primera:0,repetir:0,sin:0,p:0}); const b=porBloque[T.b]||(porBloque[T.b]={n:0,primera:0,repetir:0,sin:0,p:0});
    for(const e of (x.e||[])) errs[e]=(errs[e]||0)+1;
    if(x.r==="x") continue;
    for(const z of [a,b,tot]){ z.n++; z[x.r]++; z.p+=x.p||0; } }
  const pct=z=>z.n?Math.round(z.primera/z.n*100):0;
  const repasar=[], domina=[], marcha=[];
  for(const k in porTipo) if(!porTipo[k].n) delete porTipo[k];
  for(const k in porBloque) if(!porBloque[k].n) delete porBloque[k];
  for(const id in porTipo){ const z=porTipo[id]; const pc=z.primera/z.n;
    if(pc<0.6||z.sin>=2) repasar.push(id); else if(pc>=0.8&&z.n>=5) domina.push(id); else marcha.push(id); }
  const topErr=Object.entries(errs).sort((a,b)=>b[1]-a[1]);
  return {log,porTipo,porBloque,tot,pct,repasar,domina,marcha,topErr};
}

    ${nom?"":`<p class="aviso">Escribe tu nombre arriba para que tus resultados se guarden a tu nombre.</p>`}
  </section>
  <div class="tabs" role="tablist">
    ${[["tipos","Practicar por tipos"],["sesiones","Problemas de las sesiones"],["sim","Simulacro"],["prog","Mis progresos"]].map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${tab===k}">${l}</button>`).join("")}
  </div>
  <div id="cuerpo"></div>`;
  app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;inicio();});

  if(tab==="tipos") pestTipos(cuerpo); else if(tab==="sesiones") pestSesiones(cuerpo); else if(tab==="sim") pestSim(cuerpo); else pestProgresos(cuerpo);
}
function selNivel(actual,id){ return `<div class="seg" role="group" aria-label="Nivel" id="${id}">${[1,2,3].map(n=>`<button data-n="${n}" aria-pressed="${actual===n}">${NIVELES[n]}</button>`).join("")}</div>`; }
function pestTipos(cuerpo){
  const st=estadisticas().porTipo;
  cuerpo.innerHTML=`<div class="nivelbar"><span>Nivel:</span>${selNivel(nivelTipos,"niv")}</div>`+Object.keys(BLOQUES).map(bk=>`<h2 class="bloque">${BLOQUES[bk]}</h2><ol class="ctxlist">${TIPOS.filter(t=>t.b===bk).map(t=>{const z=st[t.id];
    return `<li><div class="ctxinfo"><b>${esc(t.t)}</b></div><span class="state">${z?`${z.n} hechas · ${Math.round(z.primera/z.n*100)} % a la primera`:"Sin empezar"}</span><button class="btn" data-id="${t.id}">Practicar</button></li>`;}).join("")}</ol>`).join("");
  cuerpo.querySelectorAll("#niv button").forEach(b=>b.onclick=()=>{nivelTipos=+b.dataset.n;inicio();});
  cuerpo.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>nuevoTipo(b.dataset.id,nivelTipos));
}
function pestSesiones(cuerpo){
  const P=perfil();
  const estado=ci=>{const c=CONTEXTOS[ci];let h=0;c.qs.forEach((q,qi)=>{const r=P.res[c.id+"-"+qi];if(r&&r.fin)h++;});return h===c.qs.length?`<span class="state done">Hecho ✓</span>`:`<span class="state">${h} de ${c.qs.length}</span>`;};
  cuerpo.innerHTML=`<p class="nota">Primero el problema de la sesión. Después, problemas similares que trabajan lo mismo: <b>Básico</b> si te ha costado, <b>Medio</b> para practicar y <b>Ampliación</b> si quieres un reto.</p>
  <ol class="ctxlist">${CONTEXTOS.map((c,ci)=>`<li class="sesrow"><span class="num">${ci+1}</span><div class="ctxinfo"><b>${esc(c.t)}</b><span>${esc(c.tema)}</span></div>${estado(ci)}
    <div class="sesbtns"><button class="btn" data-ci="${ci}">Problema de la sesión</button><span class="simlbl">Similares:</span>${[1,2,3].map(n=>`<button class="btn small" data-sci="${ci}" data-n="${n}">${NIVELES[n]}</button>`).join("")}</div></li>`).join("")}</ol>`;
  cuerpo.querySelectorAll("button[data-ci]").forEach(b=>b.onclick=()=>{const ci=+b.dataset.ci;practica({ctx:CONTEXTOS[ci],kind:"sesion",ci},0);});
  cuerpo.querySelectorAll("button[data-sci]").forEach(b=>b.onclick=()=>similar(+b.dataset.sci,+b.dataset.n));
}
function similar(ci,n){ const id=pick(CONTEXTOS[ci].sim); practica({ctx:generar(id,n),kind:"tipo",tipoId:id,nivel:n,sesion:ci,recs:[]},0); }
function nuevoTipo(id,n){ practica({ctx:generar(id,n),kind:"tipo",tipoId:id,nivel:n,recs:[]},0); }
function pestSim(cuerpo){
  cuerpo.innerHTML=`<div class="simbox">
    <div style="width:100%"><b>Simulacro:</b> problemas nuevos elegidos al azar, sin pistas y con tiempo. Verás los resultados al terminar.</div>
    <div class="checks">${Object.keys(BLOQUES).map(bk=>`<label><input type="checkbox" value="${bk}" checked> ${BLOQUES[bk]}</label>`).join("")}</div>
    <label>Problemas <select id="nprob"><option value="6">6</option><option value="10" selected>10</option><option value="20">20 (uno de cada tipo)</option></select></label>
    <label>Nivel <select id="nsim"><option value="1">Básico</option><option value="2" selected>Medio</option><option value="3">Ampliación</option></select></label>
    <label>Tiempo <select id="minutos"><option>20</option><option selected>30</option><option>40</option><option>45</option><option>60</option></select> min</label>
    <button class="btn primary" id="go">Empezar simulacro</button><span id="aviso" style="color:var(--bad)"></span></div>`;
  document.getElementById("go").onclick=()=>{

function pestProgresos(cuerpo){
  const A=estadisticas(), H=estadisticas(x=>x.d===hoy()), P=perfil();
  if(!A.tot.n&&!P.sims.length){ cuerpo.innerHTML=`<section class="results"><h2>Mis progresos</h2><p>Todavía no hay preguntas hechas${(DB.ultimo||"").trim()?"":" (recuerda escribir tu nombre)"}. Empieza en «Practicar por tipos» o en «Problemas de las sesiones».</p></section>`; return; }
  const barra=(l,z)=>`<div class="pbar"><span class="plbl">${esc(l)}</span><span class="ptrack"><span class="pfill ${A.pct(z)>=80?"hi":A.pct(z)<60?"lo":""}" style="width:${A.pct(z)}%"></span></span><span class="pnum">${A.pct(z)} % · ${z.n} preg.</span></div>`;

  cuerpo.innerHTML=`<section class="results"><h2>Mis progresos</h2>
    <div class="kpis"><div><span class="score">${H.tot.n}</span><br>preguntas hoy · ${H.pct(H.tot)} % a la primera</div><div><span class="score">${A.tot.n}</span><br>preguntas en total · ${A.pct(A.tot)} % a la primera</div></div>
    <h3>Aciertos a la primera por bloque</h3>${Object.keys(BLOQUES).filter(b=>A.porBloque[b]).map(b=>barra(BLOQUES[b],A.porBloque[b])).join("")||'<p class="muted">Sin datos.</p>'}
    <h3>Tienes que repasar</h3>${lista(A.repasar,"Nada por ahora.")}
    <h3>Lo dominas</h3>${lista(A.domina,"Aún no. Para dominar un tipo hacen falta al menos 5 preguntas con el 80 % a la primera.")}
    <h3>Tus errores más repetidos</h3>${A.topErr.length?`<ol>${A.topErr.slice(0,5).map(([e,n])=>`<li>${esc(ERR[e]||e)}: ${n} ${n===1?"vez":"veces"}</li>`).join("")}</ol>`:'<p class="muted">Sin errores registrados.</p>'}
    <h3>Simulacros</h3>${P.sims.length?`<ul>${P.sims.map(s=>`<li>${fechaES(s.d)}: ${s.ok} de ${s.total} correctas en ${s.min} min</li>`).join("")}</ul>`:'<p class="muted">Todavía ninguno.</p>'}
    <p class="muted">Repasar: menos del 60 % a la primera o 2 preguntas sin conseguir en ese tipo. Lo dominas: 80 % o más a la primera con al menos 5 preguntas.</p>
    <div class="actions"><button class="btn" id="borrar">Borrar mis datos</button></div></section>`;
  cuerpo.querySelectorAll("button[data-rep]").forEach(b=>b.onclick=()=>nuevoTipo(b.dataset.rep,nivelTipos));
  document.getElementById("borrar").onclick=()=>{ if(confirm("Se borrarán todos tus resultados de esta pizarra en este ordenador. ¿Seguro?")){ const k=clave(DB.ultimo); delete DB.perfiles[k]; guardar(); inicio(); } };
}

// ===== Paneles =====
function panelContexto(c){ return `<section class="context" id="ctx"><h2>${esc(c.t)}</h2>${c.texto.map(p=>`<p>${words(p)}</p>`).join("")}${c.extra||""}<button class="btn markbtn" id="mark" aria-pressed="false">🖍️ Subrayar datos</button></section>`; }
function activarSubrayado(){
  const ctx=document.getElementById("ctx"), b=document.getElementById("mark");
  b.onclick=()=>{const on=ctx.classList.toggle("marking"); b.setAttribute("aria-pressed",on); b.textContent=on?"✔ Terminar de subrayar":"🖍️ Subrayar datos";};
  ctx.querySelectorAll(".w").forEach(w=>w.onclick=()=>{ if(ctx.classList.contains("marking")) w.classList.toggle("hl"); });
}
function zonaRespuesta(q,el){
  if(q.tipo==="mc") return `<div class="opts" role="radiogroup">${q.o.map((x,i)=>`<button class="opt ${el===i?"sel":""}" role="radio" aria-checked="${el===i}" data-i="${i}"><span class="dot"></span><span>${esc(x.t)}</span></button>`).join("")}</div>`;
  if(q.tipo==="num") return `<div class="numin"><input id="numv" inputmode="decimal" placeholder="Tu respuesta" value="${el!=null?esc(el):""}" aria-label="Tu respuesta"><span>${esc(q.unidad||"")}</span></div>`;
  return `<div class="numin"><select id="selv" aria-label="Elige una opción"><option value="">Elige…</option>${q.sel.map((s,i)=>`<option value="${i}" ${el===i?"selected":""}>${esc(s)}</option>`).join("")}</select></div>`;
}
function leerRespuesta(q){
  if(q.tipo==="mc"){const s=document.querySelector(".opt.sel");return s?+s.dataset.i:null;}
  if(q.tipo==="num"){const v=document.getElementById("numv").value.trim();return v===""?null:v;}
  const v=document.getElementById("selv").value;return v===""?null:+v;
}
function esCorrecta(q,r){ if(r==null) return false; if(q.tipo==="mc") return !!q.o[r].ok; if(q.tipo==="num"){const n=parseNum(r);return n!=null&&Math.abs(n-q.ans)<1e-6;} return r===q.ans; }
function fallo(q,r){
  if(q.tipo==="mc") return {t:q.o[r].why||"Revisa los datos y vuelve a intentarlo.",e:q.o[r].e||"calc"};
  if(q.tipo==="num"){ const n=parseNum(r); if(n==null) return {t:"Escribe solo un número (puedes usar coma decimal).",e:null};
    for(const k in (q.wrong||{})){ if(Math.abs(Number(k)-n)<1e-6) return {t:q.wrong[k][0],e:q.wrong[k][1]}; }
    return {t:"No es correcto. Usa las pistas de las fases si las necesitas.",e:"calc"}; }
  const w=q.why&&q.why[r]; return w?{t:w[0],e:w[1]}:{t:"Revisa los datos y vuelve a intentarlo.",e:"calc"};
}
function enlazarOpciones(){ document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ document.querySelectorAll(".opt").forEach(x=>{x.classList.remove("sel");x.setAttribute("aria-checked","false");}); b.classList.add("sel");b.setAttribute("aria-checked","true");}); }

// ===== Práctica =====
function getRec(P,qi){ if(P.kind==="sesion"){ const R=perfil().res, k=P.ctx.id+"-"+qi; return R[k]||(R[k]={intentos:0,pistas:[],fin:false,res:null,errs:[]}); } return P.recs[qi]||(P.recs[qi]={intentos:0,pistas:[],fin:false,res:null,errs:[]}); }
function practica(P,qi){
  stopTimer();
  const c=P.ctx,q=c.qs[qi],r=getRec(P,qi); r.errs=r.errs||[];
  const fases=[["c","Comprender"],["p","Plan"],["e","Ejecutar"],["k","Comprobar"]];
  const titulo=P.kind==="sesion"?`Problema de la sesión ${P.ci+1}`:(P.sesion!=null?`Similar a la sesión ${P.sesion+1} · ${NIVELES[P.nivel]}`:`${esc(tipoDe(P.tipoId).t)} · ${NIVELES[P.nivel]}`);
  app.innerHTML=`
  <div class="bar"><span class="where">${titulo}</span><span class="tools">${P.kind==="tipo"?`<button class="btn" id="otro">🔄 Otro problema</button>`:""}<button class="btn" id="volver">Volver a la lista</button></span></div>
  <div class="stage">${panelContexto(c)}
    <section class="question">
      <div class="qhead">Pregunta ${qi+1} de ${c.qs.length}</div>
      <p class="prompt">${esc(q.p)}</p>${zonaRespuesta(q,null)}
      <div class="actions"><button class="btn primary" id="comprobar">Comprobar</button><button class="btn hidden" id="versol">Ver solución</button>
        <button class="btn hidden" id="sig">${qi<c.qs.length-1?"Siguiente pregunta":(P.kind==="tipo"?"Otro problema":"Terminar")}</button></div>
      <div class="fb" id="fb" role="status" aria-live="polite"></div>
      <div class="phases"><p class="lbl">¿Te atascas? Abre la pista de la fase en la que estás:</p>
        <div class="phbtns">${fases.map(f=>`<button data-f="${f[0]}" class="${r.pistas.includes(f[0])?"seen":""}">${f[1]}</button>`).join("")}</div><div class="hint" id="hint"></div></div>
      <nav class="qnav" aria-label="Preguntas">${c.qs.map((_,i)=>{const x=getRec(P,i);let cl=i===qi?"cur":"";if(x.fin)cl+=(x.res==="sin"?" wrong":" good");return `<button class="${cl}" data-q="${i}" aria-label="Pregunta ${i+1}">${i+1}</button>`;}).join("")}</nav>
    </section></div>`;
  activarSubrayado(); enlazarOpciones();
  document.getElementById("volver").onclick=inicio;
  const otro=()=>{ if(P.sesion!=null) similar(P.sesion,P.nivel); else nuevoTipo(P.tipoId,P.nivel); };
  if(P.kind==="tipo") document.getElementById("otro").onclick=otro;
  document.querySelectorAll(".qnav button").forEach(b=>b.onclick=()=>practica(P,+b.dataset.q));
  const hint=document.getElementById("hint");
  document.querySelectorAll(".phbtns button").forEach(b=>b.onclick=()=>{ const f=b.dataset.f; hint.textContent=q.h[f]; hint.classList.add("show"); b.classList.add("seen"); if(!r.fin&&!r.pistas.includes(f)){ r.pistas.push(f); guardar(); } });
  const fb=document.getElementById("fb"),sig=document.getElementById("sig"),vs=document.getElementById("versol"),comp=document.getElementById("comprobar");
  const cerrar=()=>{comp.classList.add("hidden");vs.classList.add("hidden");sig.classList.remove("hidden");sig.focus();};
  const terminar=res=>{ r.fin=true; r.res=res; registrar(P.kind==="sesion"?c.tipo:P.tipoId,res,r.pistas.length,[],P.kind==="sesion"?"ses":"pra"); };
  sig.onclick=()=>{ if(qi<c.qs.length-1) practica(P,qi+1); else if(P.kind==="tipo") otro(); else inicio(); };
  if(r.fin){ fb.className="fb show info"; fb.innerHTML=`<b>Ya la has hecho.</b> ${esc(q.sol)}`; cerrar(); return; }
  comp.onclick=()=>{
    const resp=leerRespuesta(q);
    if(resp==null){fb.className="fb show info";fb.textContent="Elige o escribe una respuesta antes de comprobar.";return;}
    if(esCorrecta(q,resp)){
      r.intentos++; terminar(r.intentos===1?"primera":"repetir");
      if(q.tipo==="mc") document.querySelector(`.opt[data-i="${resp}"]`).classList.add("okk");
      fb.className="fb show ok"; fb.innerHTML=`<b>¡Correcto!</b> ${esc(q.sol)}`; cerrar();
    }else{
      const f=fallo(q,resp); if(f.e===null){fb.className="fb show info";fb.textContent=f.t;return;}
      r.intentos++; r.errs.push(f.e); perfil().log.push({d:hoy(),t:P.kind==="sesion"?c.tipo:P.tipoId,r:"x",e:[f.e],s:P.kind==="sesion"?"ses":"pra"}); guardar();
      if(q.tipo==="mc") document.querySelector(`.opt[data-i="${resp}"]`).classList.add("nok");
      fb.className="fb show bad"; fb.innerHTML=`<b>Todavía no.</b> ${esc(f.t)}`;
      if(r.intentos>=2) vs.classList.remove("hidden");
    }
  };
  vs.onclick=()=>{ terminar("sin"); fb.className="fb show info"; fb.innerHTML=`<b>Solución.</b> ${esc(q.sol)}`;
    if(q.tipo==="mc"){const i=q.o.findIndex(x=>x.ok);document.querySelector(`.opt[data-i="${i}"]`).classList.add("okk");} cerrar(); };
}

// ===== Simulacro =====
function empezarSim(bloques,n,L,min){
  const base=()=>shuffle(TIPOS.filter(t=>bloques.includes(t.b)).map(t=>t.id)); let ids=base(); const el=[];
  while(el.length<n){ if(!ids.length) ids=base(); el.push(ids.pop()); }
  const lista=[]; el.forEach(id=>{const c=generar(id,L); c.qs.forEach((q,qi)=>lista.push({c,qi}));});
  sim={lista,i:0,resp:{},fin:Date.now()+min*60000,min,inicio:Date.now()}; verSim(); timerId=setInterval(tick,1000); tick();
}
function tick(){ if(!sim) return; const q=Math.max(0,sim.fin-Date.now()), el=document.getElementById("timer");
  if(el){el.textContent=`${Math.floor(q/60000)}:${String(Math.floor(q%60000/1000)).padStart(2,"0")}`;el.classList.toggle("low",q<180000);} if(q<=0) terminarSim(true); }
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }
function guardarRespSim(){ const it=sim.lista[sim.i], v=leerRespuesta(it.c.qs[it.qi]); if(v!=null) sim.resp[sim.i]=v; else delete sim.resp[sim.i]; }
function verSim(){
  const it=sim.lista[sim.i], c=it.c, q=c.qs[it.qi];
  app.innerHTML=`<div class="bar"><span class="where">Simulacro · pregunta ${sim.i+1} de ${sim.lista.length}</span><span class="timer" id="timer"></span></div>
  <div class="stage">${panelContexto(c)}<section class="question">
    <div class="qhead">${esc(c.t)} · pregunta ${it.qi+1} de ${c.qs.length}</div><p class="prompt">${esc(q.p)}</p>
    ${zonaRespuesta(q,sim.resp[sim.i]!==undefined?sim.resp[sim.i]:null)}
    <div class="actions"><button class="btn" id="ant" ${sim.i===0?"disabled":""}>Anterior</button><button class="btn primary" id="sigs">${sim.i<sim.lista.length-1?"Siguiente":"Revisar y terminar"}</button><button class="btn" id="fin">Terminar simulacro</button></div>
    <nav class="qnav" aria-label="Preguntas">${sim.lista.map((_,i)=>`<button class="${i===sim.i?"cur":""} ${sim.resp[i]!==undefined?"ans":""}" data-s="${i}" aria-label="Pregunta ${i+1}">${i+1}</button>`).join("")}</nav>
  </section></div>`;
  activarSubrayado(); enlazarOpciones(); tick();
  const ir=k=>{guardarRespSim();sim.i=k;verSim();};
  document.getElementById("ant").onclick=()=>ir(sim.i-1);
  document.getElementById("sigs").onclick=()=>{ if(sim.i<sim.lista.length-1) ir(sim.i+1); else {guardarRespSim();confirmarFin();} };
  document.getElementById("fin").onclick=()=>{guardarRespSim();confirmarFin();};
  document.querySelectorAll(".qnav button").forEach(b=>b.onclick=()=>ir(+b.dataset.s));
}
function confirmarFin(){ const s=sim.lista.length-Object.keys(sim.resp).length; if(s>0&&!confirm(`Te quedan ${s} preguntas sin responder. ¿Terminar de todos modos?`)){verSim();return;} terminarSim(false); }
function terminarSim(porTiempo){
  if(!sim) return; stopTimer(); if(porTiempo){try{guardarRespSim();}catch(e){}}
  let ok=0; const P=perfil();
  const items=sim.lista.map((x,i)=>{ const q=x.c.qs[x.qi], r=sim.resp[i], bien=esCorrecta(q,r); if(bien) ok++;
    const f=(!bien&&r!=null)?fallo(q,r):null; P.log.push({d:hoy(),t:x.c.tipoId,r:bien?"primera":"sin",p:0,e:f&&f.e?[f.e]:[],s:"sim"}); return {x,q,r,bien,f}; });
  const usados=Math.min(sim.min,Math.max(1,Math.round((Date.now()-sim.inicio)/60000)));
  P.sims.push({d:hoy(),ok,total:items.length,min:usados,porTiempo}); guardar(); sim=null;
  app.innerHTML=`<section class="results"><h2>${porTiempo?"Se ha acabado el tiempo":"Simulacro terminado"}</h2><div class="score">${ok} de ${items.length}</div>
    <p>Tiempo usado: ${usados} min. Revisa las preguntas falladas: cada una explica qué error lleva a esa respuesta. Tus resultados ya están en «Mis progresos».</p>
    <ol class="rlist">${items.map((it,i)=>{let tu="Sin responder"; if(it.r!=null) tu=it.q.tipo==="mc"?it.q.o[it.r].t:it.q.tipo==="sel"?it.q.sel[it.r]:it.r+" "+(it.q.unidad||"");
      return `<li><span class="tag ${it.bien?"ok":"bad"}">${i+1}. ${it.bien?"Correcta":"Incorrecta"}</span> · ${esc(it.x.c.t)}<br>${esc(it.q.p)}<br><span class="muted">Tu respuesta: ${esc(tu)}</span>${it.bien?"":`<br>${it.f?esc(it.f.t)+" ":""}<b>Solución:</b> ${esc(it.q.sol)}`}</li>`;}).join("")}</ol>
    <div class="actions"><button class="btn primary" id="vi">Volver al inicio</button></div></section>`;
  document.getElementById("vi").onclick=inicio;
}

// ===== Mi resumen =====
function resumen(){
  const d=new Date(), P=perfil(), A=estadisticas(), H=estadisticas(x=>x.d===hoy());
  const linea=z=>`${z.n} ${z.n===1?"pregunta":"preguntas"}. A la primera: ${z.primera} (${A.pct(z)} %). Al repetirlo: ${z.repetir}. Sin conseguirlo: ${z.sin}. Pistas: ${z.p}.`;
  let t=`${P.nombre||"(sin nombre)"} · ${d.toLocaleDateString("es-ES")} ${d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}\nDetectives de problemas\n\n`;
  t+=`Hoy: ${H.tot.n?linea(H.tot):"sin preguntas hechas."}\n`;
  for(const id in H.porTipo) t+=`- ${tipoDe(id).t}: ${linea(H.porTipo[id])}\n`;
  if(A.tot.n){ t+=`\nDesde el principio (desde el ${fechaES(A.log[0].d)}): ${linea(A.tot)}\n`;
    for(const b of Object.keys(BLOQUES)) if(A.porBloque[b]) t+=`- ${BLOQUES[b]}: ${A.porBloque[b].n} ${A.porBloque[b].n===1?"pregunta":"preguntas"}, ${A.pct(A.porBloque[b])} % a la primera.\n`;
    t+=`\nErrores más repetidos: ${A.topErr.length?A.topErr.slice(0,3).map(([e,n])=>`${ERR[e]} (${n})`).join("; "):"ninguno"}.\n`;
    t+=`Tiene que repasar: ${A.repasar.length?A.repasar.map(id=>`${tipoDe(id).t} (${A.pct(A.porTipo[id])} %)`).join("; "):"nada por ahora"}.\n`;
    t+=`Lo domina: ${A.domina.length?A.domina.map(id=>tipoDe(id).t).join("; "):"todavía ninguno"}.\n`; }
  if(P.sims.length){ t+=`\nSimulacros:\n`; P.sims.forEach(s=>{ t+=`- ${fechaES(s.d)}: ${s.ok} de ${s.total} correctas en ${s.min} min${s.porTiempo?" (se acabó el tiempo)":""}.\n`; }); }
  return t;
}
const dlg=document.getElementById("dlgResumen"),txt=document.getElementById("txtResumen"),cop=document.getElementById("copiado");
document.getElementById("btnResumen").onclick=()=>{txt.value=resumen();cop.textContent="";if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");};
document.getElementById("btnCerrar").onclick=()=>{if(dlg.close)dlg.close();else dlg.removeAttribute("open");};
document.getElementById("btnCopiar").onclick=async()=>{ try{await navigator.clipboard.writeText(txt.value);cop.textContent="Copiado";}catch(e){txt.select();try{document.execCommand("copy");cop.textContent="Copiado";}catch(e2){cop.textContent="Selecciona el texto y cópialo con Ctrl + C";}} };
inicio();

// ── ENVÍO DE PROGRESO A GOOGLE SHEETS ────────────────────────────────
const URL_SHEET_SCRIPT_PTP6='https://script.google.com/macros/s/AKfycbzAZRtNV1K_3nQ6ooO3QPVhITur2NkufoKKbd76EWCtmL7rz3aO-1Bx_x6xiU0rVbXk/exec';
(function(){
  const selG=document.getElementById('grupoPTP6');
  const grupoGuardado=sessionStorage.getItem('pizarraGrupoAlumna');
  if(selG&&grupoGuardado)selG.value=grupoGuardado;
  selG&&selG.addEventListener('change',()=>{if(selG.value)sessionStorage.setItem('pizarraGrupoAlumna',selG.value);});
})();
document.getElementById('btnEnviarPTP6').onclick=function(){
  const nombre=(document.getElementById('nombre').value||'').trim();
  const grupo=(document.getElementById('grupoPTP6').value||'').trim();
  const estado=document.getElementById('envioEstadoPTP6');
  if(!nombre){estado.textContent='⚠️ Escribe tu nombre primero.';estado.style.color='var(--bad)';return;}
  sessionStorage.setItem('pizarraNombreAlumna',nombre);
  if(grupo)sessionStorage.setItem('pizarraGrupoAlumna',grupo);
  const A=estadisticas(),P=perfil();
  const puntos={Grupo:grupo||'(sin grupo)'};
  puntos['DETECTIVES_TotalPreguntas']=A.tot.n;
  puntos['DETECTIVES_AciertoPrimera_pct']=A.pct(A.tot);
  puntos['DETECTIVES_Simulacros']=P.sims.length;
  if(P.sims.length){
    const ultimo=P.sims[P.sims.length-1];
    puntos['DETECTIVES_UltimoSimulacro']=ultimo.ok+'/'+ultimo.total;
  }
  Object.keys(BLOQUES).forEach(b=>{
    if(A.porBloque[b])puntos['DETECTIVES_'+BLOQUES[b]]=A.pct(A.porBloque[b]);
  });
  estado.textContent='Enviando...';estado.style.color='var(--muted)';
  fetch(URL_SHEET_SCRIPT_PTP6,{
    method:'POST',mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({nombre:nombre,puntos:puntos})
  }).then(()=>{
    estado.textContent='✅ ¡Progreso enviado, '+nombre+'!';estado.style.color='var(--ok)';
  }).catch(()=>{
    estado.textContent='❌ No se pudo enviar. Revisa tu conexión.';estado.style.color='var(--bad)';
  });
};
</script>
